<div class="profile-page-wrapper">
  <div class="profile-card">
    <div class="profile-header">
      <h2>Configurações de Perfil</h2>
      <p>Gerencie suas informações pessoais e credenciais de acesso.</p>
    </div>

    <div *ngIf="mensagem" [class]="'alert-box ' + mensagem.tipo">
      {{ mensagem.texto }}
    </div>

    <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="profile-form">
      <div class="form-section">
        <div class="input-group">
          <label>Nome Completo</label>
          <input type="text" formControlName="nome" placeholder="Ex: Aurora Beatriz Macedo">
          <span class="error-text" *ngIf="profileForm.get('nome')?.invalid && profileForm.get('nome')?.touched">
            O nome é obrigatório.
          </span>
        </div>

        <div class="input-group">
          <label>E-mail Institucional</label>
          <input type="email" formControlName="email" placeholder="seuemail@exemplo.com">
          <span class="error-text" *ngIf="profileForm.get('email')?.invalid && profileForm.get('email')?.touched">
            E-mail inválido.
          </span>
        </div>

        <div class="input-group">
          <label>Nova Senha</label>
          <input type="password" formControlName="senha" placeholder="Deixe vazio para não alterar">
          <small class="helper-text">Mínimo de 6 caracteres se for alterada.</small>
        </div>
      </div>

      <div class="form-footer">
        <button type="button" class="btn-cancel" (click)="voltar()">Cancelar</button>
        <button type="submit" class="btn-save" [disabled]="profileForm.invalid || loading">
          {{ loading ? 'Salvando...' : 'Salvar Alterações' }}
        </button>
      </div>
    </form>
  </div>
</div>
